name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run verify script
        env:
          # Skip live Yahoo to avoid flaky external network in CI.
          # Local: scripts/verify.sh runs Yahoo by default; set MUSKOMETER_SKIP_LIVE_YAHOO=1 to skip.
          MUSKOMETER_SKIP_LIVE_YAHOO: "1"
        run: ./scripts/verify.sh

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/verify-results-*.xcresult
          retention-days: 7
